<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script>
    // Redirect any 404 back to the app root, preserving the path in a query param
    var seg = 1; // number of path segments in the repo name (/upi-helper)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>Redirecting…</body>
</html>
